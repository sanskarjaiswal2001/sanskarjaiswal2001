<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="840" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="42%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-360 0; 360 0; 360 0" keyTimes="0;0.55;1" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="28" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <ellipse cx="600" cy="140" rx="420" ry="120" fill="url(#glow)">
    <animate attributeName="opacity" values="0.22;0.5;0.22" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- border path (perimeter ~2944) -->
  <path id="bp" d="M29 1 H1171 A28 28 0 0 1 1199 29 V271 A28 28 0 0 1 1171 299 H29 A28 28 0 0 1 1 271 V29 A28 28 0 0 1 29 1 Z"
        fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="260 2684" filter="url(#soft)">
    <animate attributeName="stroke-dashoffset" values="0;-2944" dur="6s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="148" text-anchor="middle" fill="url(#name)" font-size="60" font-weight="600" letter-spacing="-1.5">Sanskar Jaiswal</text>
  <text x="600" y="192" text-anchor="middle" fill="#8b949e" font-size="23" font-weight="400" letter-spacing="0.2">Software Engineer at BETSOL</text>
</svg>
