<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <radialGradient id="bg" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0a141f"/>
      <stop offset="100%" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#00d9ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200"/>
    <path d="M150 0 V280 M450 0 V280 M750 0 V280 M1050 0 V280"/>
  </g>

  <!-- moving scanline -->
  <rect x="0" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;280" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M16 16 H64 M16 16 V64"/>
    <path d="M1184 16 H1136 M1184 16 V64"/>
    <path d="M16 264 H64 M16 264 V216"/>
    <path d="M1184 264 H1136 M1184 264 V216"/>
  </g>

  <!-- ===== Arc reactor ===== -->
  <g transform="translate(150 140)">
    <g filter="url(#glow)">
      <circle r="58" fill="none" stroke="#00d9ff" stroke-width="2" stroke-opacity="0.5"/>
      <circle r="44" fill="none" stroke="#00d9ff" stroke-width="3"/>
      <circle r="22" fill="#00d9ff" fill-opacity="0.12" stroke="#7fe9ff" stroke-width="2"/>
      <circle r="9" fill="#dffaff">
        <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- reactor segments -->
      <g stroke="#00d9ff" stroke-width="3">
        <line x1="0" y1="-44" x2="0" y2="-22"/>
        <line x1="38" y1="-22" x2="19" y2="-11"/>
        <line x1="38" y1="22" x2="19" y2="11"/>
        <line x1="0" y1="44" x2="0" y2="22"/>
        <line x1="-38" y1="22" x2="-19" y2="11"/>
        <line x1="-38" y1="-22" x2="-19" y2="-11"/>
      </g>
    </g>
    <!-- rotating outer ticks -->
    <g stroke="#ffb000" stroke-width="2" stroke-opacity="0.8">
      <line x1="0" y1="-66" x2="0" y2="-58"/>
      <line x1="0" y1="66" x2="0" y2="58"/>
      <line x1="-66" y1="0" x2="-58" y2="0"/>
      <line x1="66" y1="0" x2="58" y2="0"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== Text block ===== -->
  <text x="248" y="118" fill="#e8f6ff" font-size="46" font-weight="700" letter-spacing="6">SANSKAR JAISWAL</text>
  <line x1="250" y1="138" x2="720" y2="138" stroke="#00d9ff" stroke-width="2" stroke-opacity="0.7"/>
  <text x="250" y="170" fill="#00d9ff" font-size="18" letter-spacing="5">SOFTWARE ENGINEER  //  BETSOL</text>
  <text x="250" y="202" fill="#ffb000" font-size="14" letter-spacing="3" opacity="0.9">PYTHON · LLMs · AGENTS · MCP · AUTOMATION</text>

  <!-- status readout -->
  <g transform="translate(960 44)">
    <circle cx="0" cy="-5" r="5" fill="#3affa3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" fill="#3affa3" font-size="13" letter-spacing="3">SYSTEMS ONLINE</text>
    <text x="14" y="22" fill="#5c7080" font-size="11" letter-spacing="2">ARC REACTOR · STABLE</text>
  </g>
</svg>
