<svg viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="50%" stop-color="#0a141f"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="130" fill="url(#fbg)"/>

  <!-- thin animated power line -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#00d9ff" stroke-width="1" stroke-opacity="0.25"/>
  <circle cy="40" r="4" fill="#00d9ff" filter="url(#fglow)">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- center mark -->
  <g transform="translate(600 78)" filter="url(#fglow)">
    <circle r="7" fill="none" stroke="#00d9ff" stroke-width="2"/>
    <circle r="2.5" fill="#dffaff"/>
    <line x1="-26" y1="0" x2="-12" y2="0" stroke="#00d9ff" stroke-width="2"/>
    <line x1="26" y1="0" x2="12" y2="0" stroke="#00d9ff" stroke-width="2"/>
  </g>

  <text x="600" y="110" text-anchor="middle" fill="#ffb000" font-size="15" letter-spacing="8">RIDE.  BUILD.  REPEAT.</text>
</svg>
